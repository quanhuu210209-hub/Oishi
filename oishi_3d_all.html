const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(0,0,6.5);

scene.add(new THREE.AmbientLight(0xffffff,0.75));
const key = new THREE.DirectionalLight(0xffffff,0.9); key.position.set(3,4,5); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff,0.5); fill.position.set(-4,-2,-5); scene.add(fill);

const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 2.5;
controls.minDistance = 3; controls.maxDistance = 12;

const H = 3.7, SEG_X = 48, SEG_Y = 60;

function makeSide(W, depth, sign, tex){
  const g = new THREE.PlaneGeometry(W, H, SEG_X, SEG_Y);
  const p = g.attributes.position;
  for(let i=0;i<p.count;i++){
    const u = p.getX(i)/(W/2), v = p.getY(i)/(H/2);
    const h = depth * Math.pow(Math.max(0,1-u*u),0.5) * Math.pow(Math.max(0,1-v*v),0.35);
    p.setZ(i, sign*h);
  }
  g.computeVertexNormals();
  const m = new THREE.MeshStandardMaterial({map:tex, roughness:0.35, metalness:0.15, side:THREE.DoubleSide});
  return new THREE.Mesh(g,m);
}

const group = new THREE.Group();
scene.add(group);
const loader = new THREE.TextureLoader();

// Tạo sẵn từng gói (mặt trước + mặt sau lật ngang)
const meshes = BAGS.map(b => {
  const g = new THREE.Group();
  const W = H * b.aspect, depth = 0.18 * W;
  loader.load(b.src, (t)=>{
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const front = t.clone(); front.needsUpdate = true;
    const back = t.clone(); back.needsUpdate = true;
    back.wrapS = THREE.RepeatWrapping;
    back.repeat.set(-1,1); back.offset.set(1,0);
    g.add(makeSide(W,depth,1,front));
    const bk = makeSide(W,depth,-1,back);
    bk.material.color = new THREE.Color(0xdddddd);
    g.add(bk);
  });
  return g;
});

const tabs = document.getElementById('tabs');
const title = document.getElementById('title');
function show(i){
  while(group.children.length) group.remove(group.children[0]);
  group.add(meshes[i]);
  title.textContent = 'Oishi ' + BAGS[i].name;
  [...tabs.children].forEach((btn,k)=>btn.classList.toggle('active',k===i));
}
BAGS.forEach((b,i)=>{
  const btn = document.createElement('button');
  btn.textContent = b.name;
  btn.onclick = ()=>show(i);
  tabs.appendChild(btn);
});
show(0);

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

document.getElementById('btnRotate').onclick = (e)=>{
  controls.autoRotate = !controls.autoRotate;
  e.target.textContent = 'Tự động xoay: ' + (controls.autoRotate?'BẬT':'TẮT');
};
document.getElementById('btnReset').onclick = ()=>{
  camera.position.set(0,0,6.5); controls.target.set(0,0,0); controls.update();
};

(function loop(){
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene,camera);
})();
</script>
</body>
</html>
