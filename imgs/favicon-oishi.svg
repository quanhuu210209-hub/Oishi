<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7a0014" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Nền tròn đỏ Oishi thương hiệu bo tròn cực đẹp trên mọi theme trình duyệt (sáng/tối) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#C8102E" filter="url(#shadow)"/>
  
  <!-- Chữ Oishi màu trắng đặc trưng, nét uốn lượn đặc trưng của thương hiệu Oishi -->
  <!-- Chữ O to vui nhộn -->
  <ellipse cx="20" cy="32" rx="11" ry="14" fill="#ffffff"/>
  <ellipse cx="20" cy="32" rx="5.5" ry="7" fill="#C8102E"/>
  
  <!-- Dấu chấm trên chữ i ngộ nghĩnh (trái tim/hạt snack) -->
  <circle cx="36" cy="22" r="3" fill="#FFE500"/>
  <!-- Thân chữ i -->
  <rect x="33.5" y="28" width="5" height="15" rx="2.5" fill="#ffffff"/>
  
  <!-- Ngôi sao snack giòn tan màu vàng Oishi lấp lánh -->
  <path d="M48 20 L50 25 L55 25 L51 28 L53 33 L48 30 L43 33 L45 28 L41 25 L46 25 Z" fill="#FFE500"/>
  
  <!-- Dải nụ cười / giòn rụm bên dưới -->
  <path d="M14 50 Q32 58 50 50" stroke="#FFE500" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
